name: Build AppImage

on:
  schedule:
    # Check for new Chromium stable releases daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "appimage/**"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          LATEST=$(curl -s "https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions" \
            | jq -r '.versions[0].version')
          LAST_BUILT=$(cat appimage/last-built-version.txt 2>/dev/null || echo "none")
          echo "latest=$LATEST last_built=$LAST_BUILT"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$LAST_BUILT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FUSE3-compatible appimagetool
        run: |
          # Asset filenames embed a build number that changes (e.g.
          # appimagetool-947-x86_64.AppImage), so resolve the real URL via
          # the API rather than hardcoding it.
          URL=$(curl -s "https://api.github.com/repos/probonopd/go-appimage/releases/tags/continuous" \
            | jq -r '.assets[] | select(.name | test("^appimagetool-[0-9]+-x86_64\\.AppImage$")) | .browser_download_url')
          curl -sL -o appimage/appimagetool "$URL"
          chmod +x appimage/appimagetool
      - name: Build AppImage
        run: ./appimage/build.sh "${{ needs.check-version.outputs.version }}"
      - name: Read browser version
        id: browser_version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Commit last-built version
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add appimage/last-built-version.txt
          # `git commit` legitimately exits non-zero when there's nothing
          # new to commit -- that specific case is fine to swallow. A push
          # failure is not: don't let it hide behind the same `|| true`,
          # since that's exactly what masked the missing contents:write
          # permission earlier (step showed "success" while doing nothing).
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Bump bundled Chromium to ${{ needs.check-version.outputs.version }}"
            # main can move between this job's checkout and this push (e.g.
            # a concurrent manual push, or two workflow runs overlapping) --
            # retry with a rebase instead of failing outright on the race.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected, pulling and retrying (attempt $attempt)"
              git pull --rebase
            done
          fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # Browser alpha version + underlying Chromium version, so
          # automatic Chromium-update rebuilds get distinct tags without
          # bumping the browser's own version.
          tag_name: v${{ steps.browser_version.outputs.value }}-${{ needs.check-version.outputs.version }}
          name: Lightmorphic Browser v${{ steps.browser_version.outputs.value }} (Chromium ${{ needs.check-version.outputs.version }})
          files: dist/*.AppImage
